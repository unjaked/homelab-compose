#      - ${DATA_ROOT}:/data
#    ports:
#      - 8080:8080
#    restart: unless-stopped
# Index Manager
  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/prowlarr:/config
    ports:
      - 9696:9696
    restart: unless-stopped
# Front-end for users to request content
  seerr:
    image: seerr/seerr:latest
    container_name: seerr
    init: true
    environment:
      - TZ=${TZ}
      - PORT=5055
      - LOG_LEVEL=info
    volumes:
      - ${CONFIG_ROOT}/seerr:/app/config
      - ${NAS_ROOT}:/nas
    ports:
      - 5055:5055
    restart: unless-stopped
# Torrent
#  qbittorrent:
