
# Compose for media-related services. Primarily for Jellyfin and the services it utilizes.

services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    volumes:
      - ${CONFIG_ROOT}/jellyfin/config:/config
      - ${CONFIG_ROOT}/jellyfin/cache:/cache
      - ${DATA_ROOT}:/data
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    restart: unless-stopped
