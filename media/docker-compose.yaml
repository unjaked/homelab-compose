
# Compose for media-related services. Primarily for Jellyfin and the services it utilizes.

services:
# Media Manager Server
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    user: "${PUID}:${PGID}"
    volumes:
      - ${CONFIG_ROOT}/jellyfin/config:/config
      - ${CONFIG_ROOT}/jellyfin/cache:/cache
      - ${DATA_ROOT}:/data
      - /mnt/decypharr:/mnt/decypharr:ro,rshared
      - ${NAS_ROOT}:/nas
    ports:
      - 8096:8096/tcp
      - 7359:7359/udp
    restart: unless-stopped
# Movie Manager/Automater
  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/radarr:/config
      - ${DATA_ROOT}:/data
      - /mnt/decypharr:/mnt/decypharr:rshared
      - ${NAS_ROOT}:/nas
    ports:
      - 7878:7878
    restart: unless-stopped
# TV Manager/Automater
  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/sonarr:/config
      - ${DATA_ROOT}:/data
      - /mnt/decypharr:/mnt/decypharr:rshared
      - ${NAS_ROOT}:/nas
      - ${CONFIG_ROOT}/sonarr/custom-cont-init.d:/custom-cont-init.d:ro
    ports:
      - 8989:8989
    restart: unless-stopped
# Subtitle Manager/Automater
  bazarr:
    image: lscr.io/linuxserver/bazarr:latest
    container_name: bazarr
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/bazarr:/config
      - ${DATA_ROOT}:/data
    ports:
      - 6767:6767
    restart: unless-stopped
# Usenet Client
#  sabnzbd:
