#    ports:
#      - 8081:8081
#      - 6881:6881
#      - 6881:6881/udp
#    restart: unless-stopped
# Debrid-Arr Interface (streaming)
  decypharr:
    image: cy01/blackhole:latest
    container_name: decypharr
#    user: "${PUID}:${PGID}"
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=002
      - TZ=${TZ}
    volumes:
      - ${CONFIG_ROOT}/decypharr:/app
      - /mnt:/mnt:rshared
      - ${DATA_ROOT}:/data
    ports:
      - 8282:8282
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    restart: unless-stopped
# Cloudflare protection bypass for Prowlarr
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    environment:
      - TZ=${TZ}
      - HOST=0.0.0.0
      - PORT=8191
    volumes:
      - ${CONFIG_ROOT}/byparr/screenshots:/app/screenshots
    ports:
      - 8191:8191
    restart: unless-stopped
# Arr File Cleanup Automation
  cleanuparr:
    image: ghcr.io/cleanuparr/cleanuparr:latest
    container_name: cleanuparr
    restart: unless-stopped
    ports:
      - "11011:11011"
    volumes:
      - ${CONFIG_ROOT}/cleanuparr:/config
      # Optional but useful for inspecting your final media/symlink structure.
      # Keep read-only at first so Cleanuparr cannot delete files while we test.
      - ${DATA_ROOT}:/data:ro
      - /mnt/decypharr:/downloads/decypharr:ro,rshared
    environment:
      - PORT=11011
      - BASE_PATH=
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
